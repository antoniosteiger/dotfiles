# PLACEHOLDER ONLY. Never put real values in this file: it is not encrypted.
# Real secrets go in secrets/vps.yaml, created with `sops secrets/vps.yaml` (see docs/vps.md).
# Same structure; keys marked (optional) are only needed when the matching toggle is on.
nextcloud:
  admin_password: CHANGE_ME
vaultwarden:
  admin_token: '$argon2id$CHANGE_ME_output_of_vaultwarden_hash'
paperless:
  admin_password: CHANGE_ME
  secret_key: CHANGE_ME_long_random_string
cloudflare:
  dns_api_token: CHANGE_ME # Zone:Zone:Read + Zone:DNS:Edit, single zone
restic:
  arcticbox_password: CHANGE_ME # repo password; also in secrets/arcticbox.yaml as vps_password
  arcticbox_rest_password: CHANGE_ME # plaintext of the htpasswd entry for user "vps"
  r2_password: CHANGE_ME
r2:
  access_key_id: CHANGE_ME
  secret_access_key: CHANGE_ME
gatus:
  token_restic_arcticbox_data: CHANGE_ME
  token_restic_arcticbox_state: CHANGE_ME
  token_restic_r2: CHANGE_ME
  token_autoupgrade: CHANGE_ME
  token_health: CHANGE_ME
smtp:
  password: CHANGE_ME # (optional) vps.monitoring.email.enable
