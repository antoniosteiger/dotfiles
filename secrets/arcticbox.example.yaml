# PLACEHOLDER ONLY, see secrets/vps.example.yaml. Real file: secrets/arcticbox.yaml.
# Needed only once services.resticBackupServer.enable = true on Arcticbox.
restic:
  vps_password: CHANGE_ME # must equal restic/arcticbox_password in secrets/vps.yaml
  server_htpasswd: 'vps:$2y$05$CHANGE_ME' # output of: htpasswd -nbB vps '<arcticbox_rest_password>'
