[accessibility]
ui_scale = 0.90000000596046448

[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.89999997988343239
capsule_radius = 4
center = [ "audio_visualizer" ]
concave_edge_corners = false
contact_shadow = true
end = [ "group:g5", "spacer_2", "group:g3", "spacer_2", "group:g1", "spacer_2", "group:g2", "spacer_2", "group:g4" ]
font_family = "Host Grotesk"
margin_ends = 0
position = "bottom"
radius = 0
reserve_space = false
start = [ "taskbar" ]
thickness = 25

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "date", "clock" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "volume", "input_volume", "brightness" ]
    opacity = 1.0
    padding = 6.0
    radius = 4.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "tray", "caffeine" ]
    opacity = 1.0
    padding = 6.0
    radius = 4.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "battery", "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0
    radius = 4.0

[brightness]
sync_all_monitors = true

[calendar]
enabled = true

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 800.0

[location]
address = "Munich"

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 428.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 128.0
    box_width = 288.0
    cx = 1264.0
    cy = 428.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        stat = "cpu_usage"
        stat2 = "cpu_temp"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 658.70001220703125
    cy = 428.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

[nightlight]
enabled = true

[notification]
background_opacity = 0.89999997988343239

[osd]
background_opacity = 0.89999997988343239
border = false
offset_y = 30
position = "bottom_center"
position_vertical = "bottom_center"

[plugins]
enabled = [ "noctalia/translator", "thaer99ob/default-apps" ]

[shell]
avatar_path = "/home/toni/dotfiles/DUNEO_signet_negative.png"
corner_radius_scale = 0.70000001043081284
date_format = "%A, %d.%m.%Y"
font_family = "Host Grotesk"
launch_apps_as_systemd_services = true
settings_window_translucent = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.launcher]
    compact = true
    show_app_actions = true

        [shell.launcher.providers.session]
        global = true

    [shell.panel]
    open_near_click_control_center = true
    transparency_mode = "soft"

    [shell.screenshot]
    directory = "/home/toni/screenshots"

[system.monitor]
cpu_poll_seconds = 1
memory_poll_seconds = 1

[theme]
builtin = "Gruvbox"
community_palette = "Gruvbox Material"
source = "builtin"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "qt", "starship" ]
    community_ids = [ "claude-code", "discord", "inkscape", "neovim", "prismlauncher", "steam", "fastfetch", "sioyek", "yazi" ]

[wallpaper]
directory = "/home/toni/dotfiles/backgrounds"
transition = [ "fade" ]

    [wallpaper.automation]
    enabled = true
    interval_seconds = 900

    [wallpaper.default]
    path = "/home/toni/dotfiles/backgrounds/artemis2_lunar_flyby_eclipse_integrity.jpg"

    [wallpaper.last]
    path = "/home/toni/dotfiles/backgrounds/artemis2_lunar_flyby_eclipse_integrity.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/toni/dotfiles/backgrounds/artemis2_lunar_flyby_eclipse_integrity.jpg"

[weather]
enabled = false

[widget.audio_visualizer]
bands = 32
mirrored = false
show_when_idle = true
width = 120

    [widget.audio_visualizer.actions]
    left = "panel-toggle control-center media"
    scroll_down = "media pause"
    scroll_left = "media previous"
    scroll_right = "media next"
    scroll_up = "media play"

[widget.clock]
font_family = "Host Grotesk"

    [widget.clock.actions]
    scroll_left = "wallpaper-previous"
    scroll_right = "wallpaper-next"

[widget.spacer_2]
type = "spacer"

[widget.taskbar]
capsule_padding = 0
font_family = "Host Grotesk"
group_by_workspace = true
group_single_icon_per_app = true
inactive_opacity = 0.58999999999999997
minimal = true
show_active_indicator = false
show_all_outputs = true

[widget.workspaces]
capsule = true
style = "regular"
