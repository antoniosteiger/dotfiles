# Monitors are declared per host (see host-specific.conf, sourced below).

# Autostart
exec-once = systemctl --user import-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprctl setcursor "Capitaine Cursors (Gruvbox)" 24
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Capitaine Cursors (Gruvbox)
exec-once = noctalia # status bar, includes wallpapers

# Don't render Hyprland's logo/gradient at startup - it flashes for a moment
# before noctalia paints the real wallpaper.
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x00000000
}

# Input configuration
input {
    kb_layout = de
    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1
}

# General settings
general {
    gaps_in = 5
    gaps_out = 5, 5, 30, 5
    border_size = 4

    # col.active_border / col.inactive_border come from noctalia.conf (sourced at EOF)
    layout = dwindle  # Hyprland's automatic tiling layout
}

dwindle {
    force_split = 2

    preserve_split = true
}

# Decoration
decoration {
    rounding = 10
    rounding_power = 2

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = 0xee1a1a1a
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696
    }
}


animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 2, myBezier, popin 80%
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default, slide
}

# Workspace rules (per-monitor pinning lives in host-specific.conf)
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true

# termfilechooser (yazi-based file picker): float, size and center on focused monitor
windowrule {
    name = termfilechooser
    match:class = ^(termfilechooser)$
    float = true
    size = {1000, 700}
    center = true
}

# Noctalia settings window: float + fixed size
windowrule {
    name = noctalia-settings
    match:class = ^(dev\.noctalia\.Noctalia)$
    float = true
    size = {1080, 920}
}

# Noctalia layer rule: blur its bar/panels background, and disable
# Hyprland's own layer animations so they don't fight Noctalia's own.
layerrule {
    name = noctalia
    match:namespace = noctalia-background-.*$
    ignore_alpha = 0.5
    blur = true
    blur_popups = true
}

# Key bindings
$mod = SUPER

# Basic bindings
bind = $mod, Return, exec, GTK_IM_MODULE=simple ghostty
bind = $mod, Q, killactive
bind = $mod, D, exec, noctalia msg panel-toggle launcher
bind = $mod SHIFT, S, exec, noctalia msg screenshot-region

# Focus movement (vim keys)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Focus movement (arrow keys)
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d

# Move windows (vim keys)
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Move windows (arrow keys)
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

# Fullscreen
bind = $mod, F, fullscreen, 0

# Host-specific configuration (laptop vs desktop)
source = ~/.config/hypr/host-specific.conf

# Layout controls
bind = $mod, S, layoutmsg, orientationtop     # stack layout
bind = $mod, E, layoutmsg, orientationleft    # side-by-side

# Floating
bind = $mod SHIFT, Space, togglefloating
bind = $mod, Space, focusmonitor, +1

# Scratchpad equivalent (special workspace)
bind = $mod SHIFT, minus, movetoworkspace, special
bind = $mod, minus, togglespecialworkspace

# Workspace bindings
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move to workspace
bind = $mod CTRL, 1, movetoworkspace, 1
bind = $mod CTRL, 2, movetoworkspace, 2
bind = $mod CTRL, 3, movetoworkspace, 3
bind = $mod CTRL, 4, movetoworkspace, 4
bind = $mod CTRL, 5, movetoworkspace, 5
bind = $mod CTRL, 6, movetoworkspace, 6
bind = $mod CTRL, 7, movetoworkspace, 7
bind = $mod CTRL, 8, movetoworkspace, 8
bind = $mod CTRL, 9, movetoworkspace, 9
bind = $mod CTRL, 0, movetoworkspace, 10

# Move to workspace and follow
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 1, workspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 2, workspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 3, workspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 4, workspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 5, workspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 6, workspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 7, workspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 8, workspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 9, workspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod SHIFT, 0, workspace, 10

# Noctalia IPC binds
bind = $mod, comma, exec, noctalia msg settings-toggle
bind = ALT, Tab, exec, noctalia msg window-switcher

# Audio controls
binde = , XF86AudioRaiseVolume, exec, noctalia msg volume-up
binde = , XF86AudioLowerVolume, exec, noctalia msg volume-down
bind = , XF86AudioMute, exec, noctalia msg volume-mute
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness controls (Noctalia IPC)
binde = , XF86MonBrightnessUp, exec, noctalia msg brightness-up
binde = , XF86MonBrightnessDown, exec, noctalia msg brightness-down

# System controls
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, Q, exec, noctalia msg session lock

# Resize submap
bind = $mod, R, submap, resize
submap = resize
binde = , Right, resizeactive, 10 0
binde = , Left, resizeactive, -10 0
binde = , Up, resizeactive, 0 -10
binde = , Down, resizeactive, 0 10
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf
