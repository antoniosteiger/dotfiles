# Framework Laptop 13 Pro Hyprland configuration

# Default rule for the built-in panel. It is high-DPI, so let Hyprland pick the
# scale ("auto") instead of the fixed 1 used on the ThinkPad. External-display
# rules are in hyprland.conf.
monitor = , preferred, auto, auto

# Touchpad: haptic, so a physical-feeling click works anywhere on the surface.
# Tap-to-click is off because users report accidental taps/false clicks on it
# (and a tap needs a firm press anyway). Set to true to bring it back.
input {
    touchpad {
        tap-to-click = false
    }
}

# Brightness is handled by noctalia's IPC binds in hyprland.conf.
