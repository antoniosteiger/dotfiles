# Laptop-specific Hyprland configuration (ThinkPad T14s gen2)

# Monitors: built-in panel plus whatever is plugged in.
# desc: rules only apply when that exact display is attached.
monitor = , preferred, auto, 1
monitor = HDMI-A-1, preferred, auto-up, 1
monitor = desc:BNQ BenQ PJ 0x0000012, 1920x1080@60, auto-up, 1
monitor = desc:Dell Inc. DELL S2721QSA HTMRM43, 2560x1440@59.95, auto-up, 1

# Touchpad
input {
    touchpad {
        tap-to-click = true
    }
}

# Brightness is handled by noctalia's IPC binds in hyprland.conf.

# ThinkPad special buttons for media control
bind = , XF86NotificationCenter, exec, noctalia msg media previous
bind = , XF86PickupPhone, exec, noctalia msg media toggle
bind = , XF86HangupPhone, exec, noctalia msg media next
