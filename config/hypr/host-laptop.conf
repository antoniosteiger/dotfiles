# Laptop-specific Hyprland configuration (ThinkPad T14s gen2)

# Default rule for the built-in panel; external-display rules are in hyprland.conf.
monitor = , preferred, auto, 1

# Touchpad
input {
    touchpad {
        tap-to-click = true
    }
}

# Brightness is handled by noctalia's IPC binds in hyprland.conf.

# ThinkPad special buttons for media control
bind = , XF86NotificationCenter, exec, noctalia msg media previous
bind = , XF86PickupPhone, exec, noctalia msg media toggle
bind = , XF86HangupPhone, exec, noctalia msg media next
